; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino

; Cài đặt tốc độ Serial Monitor khớp với Serial.begin(115200) trong code
monitor_speed = 115200

; Tăng tốc độ nạp code vào mạch (tùy chọn, giúp nạp nhanh hơn)
upload_speed = 921600

; Danh sách các thư viện tự động tải về
lib_deps = 
	blynkkk/Blynk @ ^1.3.2
	witnessmenow/UniversalTelegramBot @ ^1.3.0
	bblanchon/ArduinoJson @ ^6.21.4      ; Dùng bản v6 để tương thích tốt nhất với TelegramBot
	adafruit/DHT sensor library @ ^1.4.6
	adafruit/Adafruit Unified Sensor @ ^1.1.14
	olikraus/U8g2 @ ^2.35.8