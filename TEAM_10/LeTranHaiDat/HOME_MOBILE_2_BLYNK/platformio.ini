[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = 
	beegee-tokyo/DHT sensor library for ESPx@^1.19
	adafruit/Adafruit SSD1306@^2.5.16
	blynkkk/Blynk@^1.3.2
	smougenot/TM1637@0.0.0-alpha+sha.9486982048
	tzapu/WiFiManager@^2.0.17
