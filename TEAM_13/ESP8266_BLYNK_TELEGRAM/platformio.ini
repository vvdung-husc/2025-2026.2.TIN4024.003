    blynkkk/Blynk @ ^1.3.2
    
    # 2. Thư viện cho Telegram
    UniversalTelegramBot
    bblanchon/ArduinoJson @ ^6.21.5
    
    # 3. Thư viện cho Màn hình & Cảm biến
    Adafruit GFX Library
    Adafruit SSD1306
    DHT sensor library
    Adafruit Unified Sensor